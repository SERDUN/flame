name: flame_lighting
resolution: workspace
description: Light and dark for Flame scenes - lights that cut through a night, glow, and show in whatever mirrors them.
version: 0.1.0
publish_to: none
homepage: https://github.com/SERDUN/flame/tree/serdun/packages/flame_lighting
topics:
  - flame
  - lighting

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flame: ^2.0.0-dev.0
  flutter:
    sdk: flutter

dev_dependencies:
  flame_lint: ^1.4.4-dev.0
  flame_test: ^3.0.0-dev.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/pool.frag
    - shaders/light.frag
