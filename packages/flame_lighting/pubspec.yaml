name: flame_lighting
resolution: workspace
description: Light and dark for Flame side-view scenes - a night every light cuts, with shadows and sheen on wet walls.
version: 0.1.0
publish_to: none
homepage: https://github.com/SERDUN/flame/tree/serdun/packages/flame_lighting
topics:
  - flame
  - lighting

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flame: ^2.0.0-dev.0
  flame_stage: ^0.1.0
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  hooks: ^2.0.0

dev_dependencies:
  flame_lint: ^1.4.4-dev.0
  flame_test: ^3.0.0-dev.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/light.frag
    - shaders/light_compose.frag
  assets:
    # Built by hook/build.dart from flame_lighting.shaderbundle.json.
    - build/shaderbundles/flame_lighting.shaderbundle
